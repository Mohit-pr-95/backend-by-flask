<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome</title>
    <style>
        body {
            height: 100vh;
        }
        .heading {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .buttonclass {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logoutlink {
            text-decoration: none;
            color: black;
        }
        .buttonlink {
            border: 1px solid;
            height: 1.5rem;
            width: 4.6rem;
            border-radius: 5px;
        }
    .button {
        display: flex;
        border: 1px solid;
    }

    .box {
        width: 35px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        transition: all .8s;
        cursor: pointer;
        position: relative;
        background: rgb(58, 165, 253);
        overflow: hidden;
    }

    .box:before {
        content: "U";
        position: absolute;
        top: 0;
        background: #0f0f0f;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateY(100%);
        transition: transform .4s;
    }

    .box:nth-child(2)::before {
        transform: translateY(-100%);
        content: 'S';
    }

    .box:nth-child(3)::before {
        content: 'E';
    }

    .box:nth-child(4)::before {
        transform: translateY(-100%);
        content: 'R';
    }

    .box:nth-child(5)::before {
        content: 'S';
    }

    .button:hover .box:before {
        transform: translateY(0);
    }
    .outer {
        display: flex;
        justify-content: center;
        align-items: center;
    }
    </style>
</head>
    <br><br>
    <div class="outer">
        <div class="button">
            <div class="box">H</div>
            <div class="box">E</div>
            <div class="box">L</div>
            <div class="box">L</div>
            <div class="box">O</div>
        </div>
    </div>
    <br><br>
    <div class="buttonclass">
        <button class='buttonlink' type="button"><a class="logoutlink" href="/logout">Logout</a></button>
    </div>
</body>
</html>
