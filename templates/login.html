<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my site</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f8fafc;
        }
        #heading {
            text-align: center;
            color: black;
        }
        h2 {
            font-family: Sans-Serif, 'Display';
            font-weight: bolder;
            font-size: 1.8rem;
        }
        .form {
            min-height: 50vh;
            min-width: 35vh;
            background-color: white;
            border: 1px solid black;
            border-radius: 13px;
            box-shadow: 1px 1px 5px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        .outer {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .buttondiv {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .beautiful-button {
            height: 2.4rem;
            width: 13rem;
            display: inline-block;
            background: #008080;
            color: white;
            font-family: "Segoe UI", sans-serif;
            font-weight: normal;
            font-size: 17px;
            border: 1px solid;
            border-radius: 18px;
            transition: all 0.2s ease-in-out;
        }
        .beautiful-button:hover {
            box-shadow: 1px 1px 4px black;
            transform: translateY(-0.05em);
            border: 1px solid #008080;
        }
        input {
            height: 1.7rem;
            width: 13rem;
            border: 1px solid black;
            border-radius: 10px;
            transition: all 0.2s normal;
            transform: scale(1.05);
        }
        input:hover {
            box-shadow: 1px 1px 2px black;
        }
        
        span {
            font-weight: 700;
        }

        .container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .floating-icon {
            position: absolute;
            animation: animate_float 20s infinite alternate ease-in-out;
            opacity: 0.05;
        }

        .floating-icon svg {
            width: 100%;
            height: 100%;
        }

        .icon-1 { width: 120px; height: 120px; left: 10%; top: 15%; --rot: 15deg; --scale: 1; filter: blur(3px); animation-delay: 0s; animation-duration: 18s; }
        .icon-2 { width: 150px; height: 150px; left: 75%; top: 10%; --rot: -10deg; --scale: 0.8; filter: blur(5px); animation-delay: -2s; animation-duration: 22s; }
        .icon-3 { width: 100px; height: 100px; left: 85%; top: 60%; --rot: 20deg; --scale: 1.2; filter: blur(2px); animation-delay: -5s; animation-duration: 15s; }
        .icon-4 { width: 130px; height: 130px; left: 15%; top: 65%; --rot: -15deg; --scale: 0.9; filter: blur(4px); animation-delay: -7s; animation-duration: 25s; }
        .icon-5 { width: 90px; height: 90px; left: 45%; top: 80%; --rot: 5deg; --scale: 0.7; filter: blur(2px); animation-delay: -3s; animation-duration: 19s; }
        .icon-6 { width: 110px; height: 110px; left: 50%; top: 20%; --rot: 45deg; --scale: 1.1; filter: blur(4px); animation-delay: -9s; animation-duration: 21s; }
        .icon-7 { width: 80px; height: 80px; left: 25%; top: 40%; --rot: -30deg; --scale: 0.8; filter: blur(1px); animation-delay: -1s; animation-duration: 16s; }
        .icon-8 { width: 160px; height: 160px; left: 65%; top: 45%; --rot: 10deg; --scale: 0.9; filter: blur(6px); animation-delay: -4s; animation-duration: 24s; }
        .icon-9 { width: 100px; height: 100px; left: 5%; top: 85%; --rot: 60deg; --scale: 1.3; filter: blur(3px); animation-delay: -8s; animation-duration: 20s; }
        .icon-10 { width: 140px; height: 140px; left: 90%; top: 85%; --rot: -25deg; --scale: 1; filter: blur(5px); animation-delay: -6s; animation-duration: 23s; }
        .icon-11 { width: 95px; height: 95px; left: 35%; top: 10%; --rot: 75deg; --scale: 0.8; filter: blur(2px); animation-delay: -11s; animation-duration: 17s; }
        .icon-12 { width: 125px; height: 125px; left: 35%; top: 60%; --rot: -50deg; --scale: 1.1; filter: blur(4px); animation-delay: -10s; animation-duration: 26s; }

        @keyframes animate_float {
            0% { transform: scale(var(--scale)) rotate(var(--rot)) translate(0, 0); }
            33% { transform: scale(var(--scale)) rotate(calc(var(--rot) + 15deg)) translate(40px, -50px); }
            66% { transform: scale(var(--scale)) rotate(calc(var(--rot) - 10deg)) translate(-30px, 60px); }
            100% { transform: scale(var(--scale)) rotate(calc(var(--rot) + 5deg)) translate(20px, -20px); }
        }
    </style>
</head>

    <div id="heading">
        <h2>Welcome back</h2>
    </div>
    <div class="outer">
        <div class="form">
            <form method="POST" action="/submit">
                <span>Username : </span>
                <br><br>
                <input type="text" name="username" placeholder="  Enter your username">
                <br><br><hr><br>
                <span>Password : </span>
                <br><br>
                <input type="password" name="password" placeholder="  Enter your password">
                <br><br><br>
                <div class="buttondiv">
                    <button class="beautiful-button" type="submit" value="Login">Log in</button>
                </div>
            </form>
        </div>
    </div>
</body>
