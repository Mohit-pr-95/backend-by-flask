<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <style>
        body {
            height: 100vh;
        }
        .heading {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .buttonclass {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logoutlink {
            text-decoration: none;
            color: black;
        }
        .buttonlink {
            border: 1px solid;
            height: 1.5rem;
            width: 4.6rem;
            border-radius: 5px;
        }
    .button {
        display: flex;
        border: 1px solid;
        transform: scale(1.4);
    }

    .box {
        width: 35px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-size: 1.3rem;
        font-weight: 800;
        color: #fff;
        transition: all .8s;
        cursor: pointer;
        position: relative;
        background: rgb(58, 165, 253);
        overflow: hidden;
    }

    .box:before {
        content: 'A';
        position: absolute;
        top: 0;
        background: #0f0f0f;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateY(100%);
        transition: transform .4s;
    }

    .box:nth-child(2)::before {
        transform: translateY(-100%);
        content: 'D';
    }

    .box:nth-child(3)::before {
        content: 'M';
    }

    .box:nth-child(4)::before {
        transform: translateY(-100%);
        content: 'I';
    }

    .box:nth-child(5)::before {
        content: 'N';
    }

    .button:hover .box:before {
        transform: translateY(0);
    }
    .outer {
        display: flex;
        justify-content: center;
        align-items: center;
    }
        .container {
            position: fixed;
            inset: 0;          /* covers the whole viewport */
            z-index: 0;        /* behind everything */
            pointer-events: none; /* clicks pass through to the form */
            overflow: hidden;
        }
        .container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bubble {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.25);
            /* Center the bubble itself */
            left: 66%;
            top: 45%;
            transform: translate(-40%, -40%);
            animation: animate_4010 15s alternate infinite;
        }
    .bubble:nth-child(2) {
        position: relative;
        zoom: 0.45;
        left: -10px;
        top: -100px;
        animation-delay: -2s;
    }

    .bubble:nth-child(3) {
        position: relative;
        zoom: 0.45;
        right: -80px;
        top: -300px;
        animation-delay: -4s;
    }

    .bubble:nth-child(4) {
        position: relative;
        zoom: 0.35;
        left: -120px;
        bottom: -200px;
        animation-delay: -3s;
    }

    .bubble:nth-child(5) {
        position: relative;
        zoom: 0.5;
        left: 0px;
        top: 200px;
        animation-delay: -3s;
    }

    @keyframes animate_4010 {
        0%,100% {
            transform: translateY(-60px);
        }

        50% {
            transform: translateY(60px);
        }
    }

    .bubble::before {
        content: '';
        position: absolute;
        top: 50px;
        left: 45px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #fff;
        z-index: 10;
        filter: blur(2px);
    }

    .bubble::after {
        content: '';
        position: absolute;
        top: 80px;
        left: 80px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        z-index: 10;
        filter: blur(2px);
    }

    .bubble span {
        position: absolute;
        border-radius: 50%;
    }

    .bubble span:nth-child(1) {
        inset: 10px;
        border-left: 15px solid #0fb4ff;
        filter: blur(8px);
    }

    .bubble span:nth-child(2) {
        inset: 10px;
        border-right: 15px solid #ff4484;
        filter: blur(8px);
    }

    .bubble span:nth-child(3) {
        inset: 10px;
        border-top: 15px solid #ffeb3b;
        filter: blur(8px);
    }

    .bubble span:nth-child(4) {
        inset: 30px;
        border-left: 15px solid #ff4484;
        filter: blur(12px);
    }

    .bubble span:nth-child(5) {
        inset: 10px;
        border-bottom: 10px solid #fff;
        filter: blur(8px);
        transform: rotate(350deg);
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="bubble">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="bubble">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="bubble">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="bubble">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="bubble">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    <br><br>
    <div class="outer">
        <div class="button">
            <div class="box">H</div>
            <div class="box">E</div>
            <div class="box">L</div>
            <div class="box">L</div>
            <div class="box">O</div>
        </div>
    </div>
    <br><br>
    <div class="buttonclass">
        <button class='buttonlink' type="button"><a class="logoutlink" href="/logout">Logout</a></button>
    </div>
</body>
</html>
